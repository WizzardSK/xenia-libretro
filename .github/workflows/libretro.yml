name: Build libretro core

# xenia_edge_libretro (.so / .dll / .dylib), the xenia-libretro CMake target,
# built with xenia-build.py on the runners and tools upstream builds Xenia
# Edge with.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build besides Linux, comma-separated (windows, android, macos), or all'
        type: string
        default: all
  push:
    branches: [libretro]
    paths-ignore:
      - '*.md'
      - 'LICENSE'

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them; Linux is always built, as a
# quick check that it compiles. Pushes and "all" build everything.
jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # As upstream: clang 21 from apt.llvm.org with GCC 14's libstdc++, on
      # Ubuntu 22.04 for an older glibc
      - name: Setup
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository --no-update "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-21 main"
          sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends clang-21 lld-21 libclang-rt-21-dev llvm-21
          sudo apt-get -y install g++-14 ninja-build libx11-xcb-dev libwayland-dev libfontconfig1-dev liblz4-dev
          pip install --upgrade cmake
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $(grep -oP '(?<=path = )(?!third_party\/(mesa|MoltenVK|SPIRV-Cross|DirectX-Headers|DirectXShaderCompiler|libusb)).+' .gitmodules)
          ./xenia-build.py slang
          ./xenia-build.py fetchdata

      - name: Build
        env:
          CC: clang-21
          CXX: clang++-21
        run: ./xenia-build.py build --config=Release --target=xenia-libretro -- -- -k 0

      - name: Collect
        run: |
          mkdir -p dist
          core=$(find build -name 'xenia_edge_libretro.so' | head -1)
          echo "core: $core"
          cp "$core" dist/xenia_edge_libretro.so
          cp libretro/xenia_edge_libretro.info dist/
          strip --strip-unneeded dist/xenia_edge_libretro.so
          ls -la dist
          readelf -d dist/xenia_edge_libretro.so | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: xenia_edge_libretro-linux-${{ matrix.arch }}
          path: dist/

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mesa's spirv_to_dxil, D3D12's shader backend, is built by meson
      - name: Setup
        run: |
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS (Select-String -CaseSensitive '(?<=path = )(?!third_party/(MoltenVK|SPIRV-Cross)$).+' .gitmodules).Matches.Value
          python -m pip install --upgrade meson mako pyyaml packaging
          python xenia-build.py slang
          python xenia-build.py fetchdata

      # Direct3D 12's shader validator, which the D3D12 backend needs and
      # standalone downloads at run time; the core carries it inside instead
      # and writes it to system/Xenia-Edge/D3D12/. From a pinned
      # DirectXShaderCompiler release (MIT).
      - name: dxil.dll
        shell: bash
        run: |
          curl -sSL -o dxc.zip https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
          mkdir -p dxc
          python -c "import zipfile; open('dxc/dxil.dll','wb').write(zipfile.ZipFile('dxc.zip').read('bin/x64/dxil.dll'))"
          echo "XENIA_LIBRETRO_DXIL=$GITHUB_WORKSPACE/dxc/dxil.dll" >> $GITHUB_ENV

      - name: Build
        run: python xenia-build.py build --config=Release --target=xenia-libretro -- -- -k 0

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          core=$(find build -name 'xenia_edge_libretro.dll' | head -1)
          echo "core: $core"
          cp "$core" dist/xenia_edge_libretro.dll
          cp libretro/xenia_edge_libretro.info dist/
          ls -la dist
          # The pdb, kept apart: a crash's "xenia_edge_libretro.dll+<offset>"
          # in xenia.log resolves against it
          mkdir -p symbols
          pdb=$(find build -name 'xenia_edge_libretro.pdb' | head -1)
          [ -n "$pdb" ] && cp "$pdb" symbols/ || echo "no pdb"

      - uses: actions/upload-artifact@v4
        with:
          name: xenia_edge_libretro-windows-x86_64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: xenia_edge_libretro-windows-x86_64-symbols
          path: symbols/
          if-no-files-found: ignore

  # Vulkan through MoltenVK, linked into the core as upstream links it into
  # the app; the core runs Xenia's own Vulkan device and hands RetroArch the
  # frames. Apple Silicon only: the x64 backend needs the address space
  # below 4 GB, which a dylib can't free (the __PAGEZERO is RetroArch's)
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          brew install ninja
          git submodule update --init --depth=1 -j$(sysctl -n hw.ncpu) \
            $(grep -oE 'path = .+' .gitmodules | sed 's/path = //' | grep -vE 'mesa|DirectX-Headers|DirectXShaderCompiler|libusb')
          ./xenia-build.py slang
          ./xenia-build.py fetchdata

      - name: Build
        run: ./xenia-build.py build --config=Release --target=xenia-libretro --target-arch=${{ matrix.arch }} -- -- -k 0

      - name: Collect
        run: |
          mkdir -p dist
          core=$(find build* -name 'xenia_edge_libretro.dylib' | head -1)
          echo "core: $core"
          cp "$core" dist/xenia_edge_libretro.dylib
          cp libretro/xenia_edge_libretro.info dist/
          strip -x dist/xenia_edge_libretro.dylib
          codesign -f -s - dist/xenia_edge_libretro.dylib
          otool -L dist/xenia_edge_libretro.dylib
          lipo -info dist/xenia_edge_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: xenia_edge_libretro-macos-${{ matrix.arch }}
          path: dist/

  # Cross-compiled with the NDK; the shader compiler the build runs is built
  # for the host first
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          sudo apt-get -y update
          sudo apt-get -y install ninja-build
          pip install --upgrade cmake
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $(grep -oP '(?<=path = )(?!third_party\/(mesa|MoltenVK|SPIRV-Cross|DirectX-Headers|DirectXShaderCompiler|libusb)).+' .gitmodules)
          ./xenia-build.py slang
          ./xenia-build.py fetchdata

      - name: Host shader compiler
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DXENIA_ENABLE_LTO=OFF
          ninja -C build-host xenia-shader-cc
          echo "HOST_SHADER_CC=$(find $PWD/build-host -name xenia-shader-cc -type f | head -1)" >> $GITHUB_ENV

      - name: Build
        run: |
          # version.h, which xenia-build.py writes into the build directory
          python3 -c "import importlib.util as u; s=u.spec_from_file_location('xb','xenia-build.py'); m=u.module_from_spec(s); s.loader.exec_module(m); m.generate_version_h('build-android')"
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DXENIA_HOST_SHADER_CC=$HOST_SHADER_CC -DXENIA_ENABLE_LTO=OFF
          ninja -C build-android -k 0 xenia-libretro

      - name: Collect
        run: |
          mkdir -p dist
          core=$(find build-android -name 'xenia_edge_libretro_android.so' | head -1)
          echo "core: $core"
          cp "$core" dist/xenia_edge_libretro_android.so
          cp libretro/xenia_edge_libretro.info dist/
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded dist/xenia_edge_libretro_android.so
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d dist/xenia_edge_libretro_android.so | grep NEEDED
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: xenia_edge_libretro-android-${{ matrix.abi }}
          path: dist/
